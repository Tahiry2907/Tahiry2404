]
};

let currentLang='fr', index=0;

function switchLang(lang){ currentLang=lang; index=0; showLesson(); }
function showLesson(){
  const lesson=lessons[currentLang][index];
  document.getElementById('content').innerHTML=`<h2>${lesson.titre}</h2><img src="${lesson.img}" alt="${lesson.titre}"><p>${lesson.desc}</p>`;
}
function next(){ if(index<lessons[currentLang].length-1){index++; showLesson();} }
function prev(){ if(index>0){index--; showLesson();} }

showLesson();
</script>
