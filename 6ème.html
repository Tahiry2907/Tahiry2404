<h3>📌 1. Introduction</h3>

<p>
Un système informatique est constitué de plusieurs éléments
qui travaillent ensemble pour permettre à l'utilisateur de
saisir, traiter, stocker, afficher et transmettre des informations.
</p>

let currentLang = "fr";


/* =====================================================
   AFFICHER LA PAGE
===================================================== */

function renderPage(){

    const d = data[currentLang];

    document.documentElement.lang = currentLang;

    document.getElementById("pageTitle").innerHTML = d.title;

    document.getElementById("pageSubtitle").innerHTML = d.subtitle;

    document.getElementById("planTitle").innerHTML = d.planTitle;

    document.getElementById("planSearch").placeholder = d.search;

    document.getElementById("printBtn").innerHTML = d.print;

    document.getElementById("footerText").innerHTML = d.footer;

    document.getElementById("lessonContent").innerHTML = d.content;

    createPlan();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   CREER LE PLAN
===================================================== */

function createPlan(){

    const list = document.getElementById("planList");

    list.innerHTML = "";

    data[currentLang].plan.forEach(function(item){

        const a = document.createElement("a");

        a.href = "#" + item[0];

        a.textContent = item[1];

        list.appendChild(a);

    });

}


/* =====================================================
   CHANGER DE LANGUE
===================================================== */

function setLanguage(lang){

    currentLang = lang;

    renderPage();

}


/* =====================================================
   RECHERCHE
===================================================== */

function searchPlan(){

    const input =
        document.getElementById("planSearch")
        .value
        .toLowerCase();

    const links =
        document.querySelectorAll("#planList a");

    links.forEach(function(link){

        const text =
            link.textContent.toLowerCase();

        link.style.display =
            text.includes(input)
            ? "block"
            : "none";

    });

}


/* =====================================================
   CORRECTION
===================================================== */

function showAnswer(button){

    const answer =
        button.nextElementSibling;

    if(answer.style.display === "block"){

        answer.style.display = "none";

        button.innerHTML =
            currentLang === "fr"
            ? "👁️ Voir la correction"
            : "👁️ Jereo ny fanitsiana";

    }else{

        answer.style.display = "block";

        button.innerHTML =
            currentLang === "fr"
            ? "🙈 Cacher la correction"
            : "🙈 Afeno ny fanitsiana";

    }

}


/* =====================================================
   QUIZ
===================================================== */

function bonne(reponse){

    if(currentLang === "fr"){

        alert("✅ Bonne réponse : " + reponse);

    }else{

        alert("✅ Marina ny valiny : " + reponse);

    }

}


function fausse(){

    if(currentLang === "fr"){

        alert("❌ Réponse incorrecte. Réessaie !");

    }else{

        alert("❌ Tsy marina izany. Andramo indray !");

    }

}


/* =====================================================
   INITIALISATION
===================================================== */

renderPage();

</script>
