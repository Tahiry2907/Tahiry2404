<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IT Admin PRO++</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    background: #f1f5f9;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    height: 100vh;
    background: linear-gradient(180deg, #0f172a, #1e293b);
    color: white;
    padding: 20px;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    padding: 12px;
    margin: 10px 0;
    text-decoration: none;
    color: white;
    border-radius: 8px;
    transition: 0.3s;
}

.sidebar a:hover {
    background: #3b82f6;
}

/* MAIN */
.main {
    flex: 1;
    padding: 20px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.lang button {
    padding: 6px 12px;
    margin-left: 5px;
    border: none;
    background: #3b82f6;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

/* CARDS */
.cards {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.card {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* CHART */
.chart {
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>IT ADMIN</h2>
    <a href="#">🏠 Dashboard</a>
    <a href="#">👨🎓 Mpianatra</a>
    <a href="#">💻 Parc Info</a>
    <a href="#">🛡️ Sécurité</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <h1 id="title">Tableau de Bord</h1>
        <div class="lang">
            <button onclick="setLang('fr')">FR</button>
            <button onclick="setLang('ml')">ML</button>
        </div>
    </div>

    <!-- CARDS -->
    <div class="cards">
        <div class="card">
            <h3 id="etudiant">Étudiants</h3>
            <p>150</p>
        </div>

        <div class="card">
            <h3 id="virus">Virus détectés</h3>
            <p>0</p>
        </div>

        <div class="card">
            <h3 id="machine">Machines</h3>
            <p>25</p>
        </div>
    </div>

    <!-- GRAPH -->
    <div class="chart">
        <canvas id="myChart"></canvas>
    </div>

</div>

<script>
// GRAPH
const ctx = document.getElementById('myChart');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Jan', 'Fev', 'Mar', 'Avr'],
        datasets: [{
            label: 'Activité',
            data: [10, 20, 15, 30],
            borderWidth: 1
        }]
    }
});

// LANGUE
function setLang(lang) {
    if(lang === 'fr'){
        document.getElementById("title").innerText = "Tableau de Bord";
        document.getElementById("etudiant").innerText = "Étudiants";
        document.getElementById("virus").innerText = "Virus détectés";
        document.getElementById("machine").innerText = "Machines";
    } else {
        document.getElementById("title").innerText = "Takelaka Fandraisana";
        document.getElementById("etudiant").innerText = "Mpianatra";
        document.getElementById("virus").innerText = "Virus hita";
        document.getElementById("machine").innerText = "Solosaina";
    }
}
</script>

</body>
</html>
